        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnionArtifact'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /maplestorytw/v1/user/union-champion:
    get:
      tags:
        - 聯盟
      summary: 聯盟冠軍資訊查詢
      description: |-
        查詢聯盟冠軍資訊。
        <br>可查詢自 2025 年 12 月 18 日起的資料。
      operationId: maplestory_get_union_champion
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
            type: string
        - name: ocid
          in: query
          description: 角色識別碼
          required: true
          schema:
            type: string
        - name: date
          in: query
          description: 查詢基準日（KST，YYYY-MM-DD）
          schema:
            type: string
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnionChampion'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
components:
  schemas:
    Union:
      type: object
      properties:
        date:
          type: string
          description: 要搜尋的日期 (TST，每日資料中的小時與分鐘將顯示為 0)
          example: "2025-01-21T00:00+08:00"
        union_level:
          type: number
          format: int64
          description: 聯盟等級
        union_grade:
          type: string
          description: 聯盟階級
        union_artifact_level:
          type: number
          format: int64
          description: 神器等級 
        union_artifact_exp:
          type: number
          format: int64
          description: 持有的神器經驗值  
        union_artifact_point:
          type: number
          format: int64
          description: 持有的神器點數  
    UnionRaider:
      type: object
      properties:
        date:
          type: string
          description: 要搜尋的日期 (TST，每日資料中的小時與分鐘將顯示為 0)
          example: "2025-10-15T00:00+08:00"
        union_raider_stat:
          type: array
          description: 戰地攻擊隊員效果
          items:
            type: string
        union_occupied_stat:
          type: array
          description: 戰地攻擊隊佔領效果
          items:
            type: string
        union_inner_stat:
          type: array
          description: 戰地攻擊隊部署
          items:
            type: object
            properties:
              stat_field_id:
                type: string
                description: 攻擊單位部署位置 (以 11 點鐘方向為起點，順時針 0-7)
              stat_field_effect:
                type: string
                description: 相關區域佔領效果
        union_block:
          type: array
          description: 聯盟方塊資訊
          items:
            type: object
            properties:
              block_type:
                type: string
                description: 方塊編制 (戰士、法師、弓箭手、盜賊、海盜、混合)
              block_class:
                type: string
                description: 方塊角色職業
              block_level:
                type: string
                description: 方塊角色等級
              block_control_point:
                type: object
                description: |
                  方塊基準點座標
                  - 四個中央方塊的右下角為位置 x : 0, y : 0
                  - 向左移動一格，x 減少 1
                  - 向右移動一格，x 增加 1
                  - 向下移動一格，y 減少 1
                  - 向上移動一格，y 增加 1
                properties:
                  x:
                    type: number
                    format: int64
                    description: 方塊基準點 x 座標
                  y:
                    type: number
                    format: int64
                    description: 方塊基準點 y 座標
              block_position:
                type: array
                description: "方塊佔領區域的座標 (null：未部署時)"
                items:
                  type: object
                  properties:
                    x:
                      type: number
                      format: int64
                      description: 方塊 x 座標
                    y:
                      type: number
                      format: int64
                      description: 方塊 y 座標
        use_preset_no:
          type: number
          format: int64
          description: 目前套用的預設編號
        union_raider_preset_1:
          type: object
          description: 聯盟預設 1 資訊 
          properties: 
            union_raider_stat:
