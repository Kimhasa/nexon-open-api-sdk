openapi: 3.0.3
info:
  title: 楓之谷東南亞 API
  version: 1.0.0
  contact:
    name: help_openapi@nexon.co.kr
  description: |-
    - 楓之谷遊戲資料平均在 15 分鐘後即可使用。
    - 您可以從 2025 年 10 月 15 日起搜尋資料。
    - 您可以輸入所需日期以搜尋過往資料。前一日的資料將於翌日凌晨 2:00 起提供。(當您搜尋 10 月 14 日的資料時，將會擷取從 14 日 00:00 到 15 日 00:00 的資料。)
    - 由於遊戲內容變動，OCID 可能會有所變更。在更新以 OCID 為基礎的服務時，請務必留意。
    - 此 API 提供來自楓之谷台灣的資料。
servers:
  - url: 'https://open.api.nexon.com'
tags:
  - name: 角色
    description: 檢視角色資訊

paths:
 /maplestorytw/v1/id:
    get:
      tags:
        - 角色
      summary: 檢視角色辨識器 (OCID)
      description: 檢視角色辨識器 (OCID)。
      operationId: maplestory_get_character_id
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
            type: string
        - name: character_name
          in: query
          description: 角色名稱
          required: true
          schema:
            type: string

      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
                   
