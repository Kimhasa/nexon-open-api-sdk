    CharacterDojang:
      type: object
      properties:
        date:
          type: string
          description: 要搜尋的日期 (TST，每日資料中的小時與分鐘將顯示為 0)
          example: "2025-10-15T00:00+08:00"
        character_class:
          type: string
          description: 角色職業
        world_name:
          type: string
          description: 世界名稱
        dojang_best_floor:
          type: number
          format: int64
          description: 武陵道場最高紀錄層數
        date_dojang_record:
          type: string
          description: 達成武陵道場最高紀錄的日期 (TST，每日資料的小時與分鐘顯示為 0)
          example: "2025-10-15T00:00+08:00"
        dojang_best_time:
          type: number
          format: int64
          description: 通關武陵道場最高樓層所花費的時間 (秒)
    CharacterFamiliar:
      type: object
      properties:
        date:
          type: string
          description: 要搜尋的日期 (TST，每日資料中的小時與分鐘將顯示為 0)
          example: "2026-06-22T00:00+08:00"
        familiar_link_slot:
          type: array
          description: 萌獸 鏈路插槽資訊
          items:
            type: object
            properties:
              slot_id:
                type: string
                description: 插槽標識符 (1~3, vip)
              familiar_name:
                type: string
                description: 連結的 萌獸 名稱 (如果插槽中沒有任何關聯，則為 null)
              active_flag:
                type: string
                description: 已啟用還是未啟用 (true, false)
              expire_date:
                type: string
                description: 截止日期
        familiar_info:
          type: array
          description: 萌獸 細節
          items:
            type: object
            properties:
              familiar_name:
                type: string
                description: 萌獸 名稱
              familiar_nickname:
                type: string
                description: 萌獸 暱稱
              familiar_special_flag:
                type: string
                description: 特別與否
              familiar_state:
                type: string
                description: 萌獸 情況
              familiar_level:
                type: integer
                format: int64
                description: 等級
              familiar_exp:
                type: integer
                format: int64
                description: 經驗
              skill_name:
                type: string
                description: 具備的技能
              option_level:
                type: integer
                format: int64
                description: 選項等級
              option:
                type: array
                description: 選項訊息
                items:
                  type: object
                  properties:
                    option_no:
                      type: integer
                      format: int64
                      description: 選項號
                    option_name:
                      type: string
                      description: 選項名稱
                    option_value:
                      type: string
                      description: 選擇權價值
              familiar_grade:
                type: string
                description: 等級
              look_name:
                type: string
                description: 外觀名稱
              summoned_flag:
                type: string
                description: 當前是否已被召喚
              slot_id:
                type: string
                description: 連結槽索引 (1~3, vip, not link)
    ErrorMessage:
      type: object
      properties:
        error:
          type: object
          properties:
            name:
              type: string
              description: 錯誤名稱
            message:
              type: string
              description: 錯誤描述
