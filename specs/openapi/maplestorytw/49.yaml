 /maplestorytw/v1/character/skill:
    get:
      tags:
        - 角色
      summary: 檢視技能資訊
      description: 檢視角色技能與超技能資訊。
      operationId: maplestory_get_character_skill
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
            type: string
        - name: ocid
          in: query
          description: 角色辨識器
          required: true
          schema:
            type: string
        - name: date
          in: query
          description: 要搜尋的日期 (TST，YYYY-MM-DD)
          schema:
            type: string
        - name: character_skill_grade
          in: query
          description: |
            您要檢視的轉職階段
            - 0： 0轉技能與神之子共用技能
            - 1： 1轉技能
            - 1.5： 1.5轉技能
            - 2： 2轉技能
            - 2.5： 2.5轉技能
            - 3： 3轉技能
            - 4： 4轉技能與神之子阿爾法/蓓塔技能
            - hyperpassive： 被動超技能
            - hyperactive： 主動超技能
            - 5： 5轉技能
            - 6： 6轉技能
          required: true
          schema:
            type: string
            default: "1"
            enum:
              - "0"
              - "1"
              - "1.5"
              - "2"
              - "2.5"
              - "3"
              - "4"
              - "hyperpassive"
              - "hyperactive"
              - "5"
              - "6"
            
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterSkill'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

