components:
  schemas:
    Character:
      type: object
      properties:
        ocid:
          type: string
          description: 角色辨識器
    CharacterBasic:
      type: object
      properties:
        date:
          type: string
          description: 要搜尋的日期 (TST，每日資料中的小時與分鐘將顯示為 0)
          example: "2025-10-15T00:00+08:00"
        character_name:
          type: string
          description: 角色名稱
        world_name:
          type: string
          description: 世界名稱
        character_gender:
          type: string
          description: 角色性別
        character_class:
          type: string
          description: 角色職業
        character_class_level:
          type: string
          description: 角色轉職次數
        character_level:
          type: number
          format: int64
          description: 角色等級
        character_exp:
          type: number
          format: int64
          description: 當前等級的經驗值
        character_exp_rate:
          type: string
          description: 當前等級的經驗值百分比
        character_guild_name:
          type: string
          description: 角色所屬公會的名稱
        character_image:
          type: string
          description: |
            角色外型圖片
            - 您可以在已擷取角色外型圖片的 URL 中使用查詢參數，來修改角色圖片的動作或表情。
            - 擷取查詢參數的方法是在 API 擷取的 URL 後輸入問號 (?) 及「Key=value」。
            - To deliver multiple query parameters, enter them as a single string with an ampersand (&) between the parameters.  
            - 您可以在動作與表情中輸入影格數值 (「Key=value.number」)，以逐格檢視角色圖片。
            - 範例：https://open.api.nexon.com/static/maplestorytw/character/look/ABCDEFG**?action=A00.2&emotion=E00&width=200&height=200**
            - 可用於角色外型圖片的查詢參數如下。 
              - action：動作 (A00-A41)
                - A00: stand1 (預設)<br> - 影格：0 ~ 2
                - A01: stand2<br> - 影格：0 ~ 2
                - A02: walk1<br> - 影格：0 ~ 3
                - A03: walk2<br> - 影格：0 ~ 3
                - A04: prone<br> - 影格：0
                - A05: fly<br> - 影格：0 ~ 1
                - A06: jump<br> - 影格：0
                - A07: sit<br> - 影格：0
                - A08: ladder<br> - 影格：0 ~ 1
                - A09: rope<br> - 影格：0 ~ 1
                - A10: heal<br> - 影格：0 ~ 2
                - A11: alert<br> - 影格：0 ~ 2
                - A12: proneStab<br> - 影格：0 ~ 1
                - A13: swingO1<br> - 影格：0 ~ 2
                - A14: swingO2<br> - 影格：0 ~ 2
                - A15: swingO3<br> - 影格：0 ~ 2
                - A16: swingOF<br> - 影格：0 ~ 3
                - A17: swingP1<br> - 影格：0 ~ 2
                - A18: swingP2<br> - 影格：0 ~ 2
                - A19: swingPF<br> - 影格：0 ~ 3
                - A20: swingT1<br> - 影格：0 ~ 2
                - A21: swingT2<br> - 影格：0 ~ 2
                - A22: swingT3<br> - 影格：0 ~ 2
                - A23: swingTF<br> - 影格：0 ~ 3
                - A24: stabO1<br> - 影格：0 ~ 1
                - A25: stabO2<br> - 影格：0 ~ 1
                - A26: stabOF<br> - 影格：0 ~ 2
                - A27: stabT1<br> - 影格：0 ~ 2
                - A28: stabT2<br> - 影格：0 ~ 2
                - A29: stabTF<br> - 影格：0 ~ 3
                - A30: shoot1<br> - 影格：0 ~ 2
                - A31: shoot2<br> - 影格：0 ~ 4
                - A32: shootF<br> - 影格：0 ~ 2
                - A33: dead<br> - 影格：0
                - A34: ghostwalk<br> - 影格：0 ~ 3
                - A35: ghoststand<br> - 影格：0 ~ 2
                - A36: ghostjump<br> - 影格：0
                - A37: ghostproneStab<br> - 影格：0 ~ 1
                - A38: ghostladder<br> - 影格：0 ~ 1
                - A39: ghostrope<br> - 影格：0 ~ 1
                - A40: ghostfly<br> - 影格：0 ~ 1
                - A41: ghostsit<br> - 影格：0 ~ 0
              - emotion：表情 (E00-E24)
                - E00: default (預設)<br> - 影格：0
                - E01: wink<br> - 影格：0
                - E02: smile<br> - 影格：0
                - E03: cry<br> - 影格：0
                - E04: angry<br> - 影格：0
                - E05: bewildered<br> - 影格：0
                - E06: blink<br> - 影格：0 ~ 2
                - E07: blaze<br> - 影格：0 ~ 1
                - E08: bowing<br> - 影格：0 ~ 1
                - E09: cheers<br> - 影格：0
                - E10: chu<br> - 影格：0
                - E11: dam<br> - 影格：0 ~ 1
                - E12: despair<br> - 影格：0 ~ 1
                - E13: glitter<br> - 影格：0 ~ 1
                - E14: hit<br> - 影格：0
                - E15: hot<br> - 影格：0 ~ 1
                - E16: hum<br> - 影格：0 ~ 1
                - E17: love<br> - 影格：0 ~ 1
                - E18: oops<br> - 影格：0
                - E19: pain<br> - 影格：0
                - E20: troubled<br> - 影格：0
                - E21: qBlue<br> - 影格：0
                - E22: shine<br> - 影格：0
                - E23: stunned<br> - 影格：0
                - E24: vomit<br> - 影格：0 ~ 1
              - wmotion: 武器動作 (W00-W04)
                - W00：預設動作 (預設，依照武器類型的動作)
                - W01：單手武器動作
                - W02：雙手武器動作
                - W03：槍械動作
                - W04：無武器動作
              - width：寬度 (對應背景大小，96 (預設) 至 1000)
              - height：高度 (對應背景大小，96 (預設) 至 1000)
              - x：角色的水平座標 (座標範圍 0 < x < 寬度，0 對應至最左起點)
              - y：角色的垂直座標 (座標範圍 0 < y < 高度，0 對應至最上方起點)
        character_date_create:
          type: string
          description: 角色建立日期 (TST，每日資料中的小時與分鐘將顯示為 0)
          example: "2025-10-15T00:00+08:00"
        access_flag:
          type: string
          description: "過去 7 天的登入狀態 (true：已登入，false：未登入)"
        liberation_quest_clear:
          type: string
          description: "解放任務完成狀態 (0：未完成，1：創世武器已解放, 2:命運武器第一階段解放)"
          
    CharacterPopularity:
      type: object
