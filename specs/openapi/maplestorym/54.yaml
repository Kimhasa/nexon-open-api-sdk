openapi: 3.0.3
info:
  title: 메이플스토리M API
  version: 1.0.0
  contact:
    name: help_openapi@nexon.co.kr
  description: |-
    - 2025년 11월 27일 데이터부터 조회할 수 있습니다.
    - 랭킹은 매일 오전 2시 30분 경에 1일 1회 집계되어 제공됩니다.
    - 전체 월드 랭킹 기준으로 1만등까지의 랭킹이 제공됩니다.
    - 최대 2년 전의 데이터를 조회할 수 있습니다.

servers:
  - url: 'https://open.api.nexon.com'
tags:
  - name: Ranking
    description: 랭킹 정보 조회

paths:
  /maplestorym/v1/ranking/level:
    get:
      tags:
        - Ranking
      summary: 레벨 랭킹 정보 조회
      description: 레벨 랭킹 정보를 조회합니다.
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
            type: string
        - name: date
          in: query
          description: 조회 기준일 (KST). 
          example: "2025-11-27"
          required: true
          schema:
            type: string
        - name: world_name
          in: query
          description: 월드 명<br>월드 명과 캐릭터 식별자는 동시에 사용할 수 없습니다.  
          required: false
          schema:
            type: string
            enum:
              - 아케인
              - 크로아
              - 엘리시움
              - 루나
              - 스카니아
              - 유니온
              - 제니스
              - 챌린저스
        - name: ocid
          in: query
          description: 캐릭터 식별자<br>월드 명과 캐릭터 식별자는 동시에 사용할 수 없습니다.       
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: 페이지 번호<br>한 page에 200개의 결과가 응답됩니다.    
          required: false
          schema:
            type: number
            format: int64            

      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LevelRanking'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

