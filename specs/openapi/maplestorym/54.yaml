components:
  schemas:
    LevelRanking:
      type: object
      properties:
        ranking:
          type: array
          description: 레벨 랭킹 정보
          items:
            properties:
              date:
                type: string
                description: 랭킹 업데이트 일자 (KST)
              ranking:
                type: number
                format: int64
                description: 전체 월드 랭킹 순위
              world_ranking:
                type: number
                format: int64
                description: 소속 월드 랭킹 순위
              character_name:
                type: string
                description: 캐릭터 명
              world_name:
                type: string
                description: 월드 명
              character_class:
                type: string
                description: 캐릭터 직업 명
              character_level:
