openapi: 3.0.3
info:
  title: NEXON Open API 공지
  version: 1.0.0
  contact:
    name: help_openapi@nexon.co.kr
  description: |-
    - NEXON Open API의 공지 사항을 조회할 수 있는 API입니다.

servers:
- url: 'https://open.api.nexon.com'

tags:
- name: Notice
  description: 공지 사항 조회


paths:
  /platform/openapi/v1/notice:
    get:
      tags:
      - Notice
      summary: NEXON Open API 공지 사항
      description: NEXON Open API에 최근 등록된 공지 사항 10개를 가져옵니다.
      operationId: open_api_get_notice
      parameters:
      - name: x-nxopen-api-key
        in: header
        description: API KEY
        required: true
        schema:
          type: string
      - name: game_name
        in: query
        description: |-
          특정 게임의 NEXON Open API 공지를 조회할 때 입력합니다.
          빈 값으로 입력할 경우 전체 공지를 조회합니다.
        schema:
          type: string
          enum:
          - 공통
          - 메이플스토리
          - EA SPORTS FC 온라인
          - 바람의나라
          - 바람의나라:연
          - 카트라이더 러쉬플러스
          - 히트2
          - V4
          - 마비노기 영웅전
          - 메이플스토리M
          - 크레이지 아케이드
          - 플랫폼

      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'



components:
  schemas:
    NoticeList:
      type: object
      properties:
        notice:
          type: array
          description: 공지 목록
          items:
            type: object
            properties:
              game_name:
                type: string
                description: 공지 대상 게임
              title:
                type: string
                description: 공지 제목
              url:
                type: string
                description: 공지 링크
              contents:
                type: string
                description: 공지 본문
              date:
                type: string
                description: 공지 등록일(시) (UTC0)
                example: "2023-12-14T08:28:35Z"
              notice_tag:
                type: array
                description: 설정된 공지 태그
                items:
                  type: string

    ErrorMessage:
      type: object
      properties:
        error:
          type: object
          properties:
            name:
              type: string
              description: 에러 명
              example: string
            message:
              type: string
              description: 에러 설명
              example: stirng
