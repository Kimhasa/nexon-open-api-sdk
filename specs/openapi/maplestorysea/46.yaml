components:
  schemas:
    Union:
      type: object
      properties:
        date:
          type: string
          description: Reference date for query (SGT, daily data with hours and minutes set to 0)
          example: "2025-01-21T00:00+08:00"
        union_level:
          type: number
          format: int64
          description: Union level
        union_grade:
          type: string
          description: Union grade
        union_artifact_level:
          type: number
          format: int64
          description: Artifact level
        union_artifact_exp:
          type: number
          format: int64
          description: Earned Artifact EXP 
        union_artifact_point:
          type: number
          format: int64
          description: Earned Artifact Points  
    UnionRaider:
      type: object
      properties:
        date:
          type: string
          description: Reference date for query (SGT, daily data with hours and minutes set to 0)
          example: "2025-01-21T00:00+08:00"
        union_raider_stat:
          type: array
          description: Union raid member effects
          items:
            type: string
        union_occupied_stat:
          type: array
          description: Union raid capture effects
          items:
            type: string
        union_inner_stat:
          type: array
          description: Union raider deployment
          items:
            type: object
            properties:
              stat_field_id:
                type: string
                description: Raider deployment position (0 to 7, clockwise from 11 o'clock)
              stat_field_effect:
                type: string
                description: Occupation effects over the area
        union_block:
          type: array
          description: Union Legion Block
          items:
            type: object
            properties:
              block_type:
                type: string
                description: Block shapes (Warrior, Magician, Bowman, Thief, Pirate, Maple M, Hybrid)
              block_class:
                type: string
                description: Character class corresponding to the block
              block_level:
                type: string
                description: Character level corresponding to the block
              block_control_point:
                type: object
                description: |
                  Coordinates of the block's reference point:
                  - The bottom-right square among the four central squares is positioned at x: 0, y: 0.
                  - Moving one square to the left decreases x by 1.
                  - Moving one square to the right increases x by 1.
                  - Moving one square downward decreases y by 1.
                  - Moving one square upward increases y by 1.
                properties:
                  x:
                    type: number
                    format: int64
                    description: Block reference point X-coordinate
                  y:
                    type: number
                    format: int64
                    description: Block reference point Y-coordinate
              block_position:
                type: array
                description: Coordinates of the area occupied by the block (null if not placed)
                items:
                  type: object
                  properties:
                    x:
                      type: number
                      format: int64
                      description: Block X-coordinate
                    y:
                      type: number
                      format: int64
                      description: Block Y-coordinate
