openapi: 3.0.3
info:
  title: MapleStorySEA API
  version: 1.0.0
  contact:
    name: help_openapi@nexon.co.kr
  description: |-
    - MapleStory game data can be verified approximately 15 minutes after updates.
    - Data is available starting from April 20, 2025. 
    - Historical data can be queried by specifying the desired date, and data from the previous day can be accessed starting at 2 AM the next day. (For example, when querying data for December 22, data from 00:00 to 24:00 on December 22 will be retrieved.)
    - Due to game content changes, the ocid may be updated. Please pay attention to this when updating services based on ocid.
    - This API provides data for MapleStory SEA.
servers:
  - url: 'https://open.api.nexon.com'
tags:
  - name: Union
    description: Retrieve Union information

paths:
  /maplestorysea/v1/user/union:
    get:
      tags:
        - Union
      summary: Retrieve Union information
      description: Retrieves Union level and Union rank information.
      operationId: maplestory_get_union
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
            type: string
        - name: ocid
          in: query
          description: Character identifier
          required: true
          schema:
            type: string
        - name: date
          in: query
          description: Reference date for query (SGT, YYYY-MM-DD)
          schema:
            type: string

      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Union'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /maplestorysea/v1/user/union-raider:
    get:
      tags:
        - Union
      summary: Retrieve Union Raider information
      description: Retrieves detailed information about raid member effects and capture effects deployed in the Union.
      operationId: maplestory_get_union_raider
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
