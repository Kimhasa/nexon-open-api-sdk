          example: "2025-01-21T00:00+08:00"
        union_artifact_effect:
          type: array
          description: Artifact effect information
          items:
            type: object
            properties: 
              name:
                type: string
                description: Name of the artifact effect 
              level:
                type: number
                format: int64
                description: Level of the artifact effect 
        union_artifact_crystal:
          type: array
          description: Artifact crystal information
          items:
            type: object
            properties: 
              name: 
                type: string
                description: Name of the artifact crystal 
              validity_flag:
                type: string
                description: Validity of the stat (0:Valid, 1:Invalid)
              date_expire:
                type: string
                description: Expiration date of the stat (SGT)
                example: "2023-12-21T17:28+08:00"
              level:
                type: number
                format: int64
                description: Grade of the artifact crystal
              crystal_option_name_1: 
                type: string
                description: First option of the artifact crystal
              crystal_option_name_2: 
                type: string
                description: Second option of the artifact crystal              
              crystal_option_name_3: 
                type: string
                description: Third option of the artifact crystal  
        union_artifact_remain_ap:
