openapi: 3.0.3
info:
  title: MapleStorySEA API
  version: 1.0.0
  contact:
    name: help_openapi@nexon.co.kr
  description: |-
    - MapleStory game data can be verified approximately 15 minutes after updates.
    - Data is available starting from April 20, 2025. 
    - Historical data can be queried by specifying the desired date, and data from the previous day can be accessed starting at 2 AM the next day. (For example, when querying data for December 22, data from 00:00 to 24:00 on December 22 will be retrieved.)
    - Due to game content changes, the ocid may be updated. Please pay attention to this when updating services based on ocid.
    - This API provides data for MapleStory SEA.
servers:
  - url: 'https://open.api.nexon.com'
tags:
  - name: Character
    description: Retrieve character information

paths:
 /maplestorysea/v1/id:
    get:
      tags:
        - Character
      summary: Retrieve character identifier (ocid)
      description: Retrieves the character identifier (ocid).
      operationId: maplestory_get_character_id
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
            type: string
        - name: character_name
          in: query
          description: Character name
          required: true
          schema:
            type: string

      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
                   
