components:
  schemas:
    Character:
      type: object
      properties:
        ocid:
          type: string
          description: Character identifier
    CharacterBasic:
      type: object
      properties:
        date:
          type: string
          description: Reference date for query (SGT, daily data with hours and minutes set to 0)
          example: "2025-01-21T00:00+08:00"
        character_name:
          type: string
          description: Character name
        world_name:
          type: string
          description: World name
        character_gender:
          type: string
          description: Character gender
        character_class:
          type: string
          description: Character job
        character_class_level:
          type: string
          description: Character job advancement tier
        character_level:
          type: number
          format: int64
          description: Character level
        character_exp:
          type: number
          format: int64
          description: Experience points gained at the current level
        character_exp_rate:
          type: string
          description: Percentage of experience points at the current level
        character_guild_name:
          type: string
          description: Guild name the character belongs to
        character_image:
          type: string
          description: |
            Character appearance image
            - You can use query parameters on the retrieved character appearance image URL to modify the character's action or expression.
            - Query parameters can be appended to the URL retrieved by the API by adding a question mark (?) followed by "Key=value" pairs.
            - To provide multiple query parameters, separate them with an ampersand (&) and input them as a single string.  
            - You can input frame values ("Key=value.number") for actions and expressions to view the avatar image by frame. 
            - Example: https://open.api.nexon.com/static/maplestorysea/character/look/ABCDEFG**?action=A00.2&emotion=E00&width=200&height=200**
            - Available query parameters for the character appearance image are as follows. 
              - action: Actions (A00 ~ A41)
                - A00: stand1 (default)<br> - frame: 0 ~ 2
                - A01: stand2<br> - frame: 0 ~ 2
                - A02: walk1<br> - frame: 0 ~ 3
                - A03: walk2<br> - frame: 0 ~ 3
                - A04: prone<br> - frame: 0
                - A05: fly<br> - frame: 0 ~ 1
                - A06: jump<br> - frame: 0
                - A07: sit<br> - frame: 0
                - A08: ladder<br> - frame: 0 ~ 1
                - A09: rope<br> - frame: 0 ~ 1
                - A10: heal<br> - frame: 0 ~ 2
                - A11: alert<br> - frame: 0 ~ 2
                - A12: proneStab<br> - frame: 0 ~ 1
                - A13: swingO1<br> - frame: 0 ~ 2
                - A14: swingO2<br> - frame: 0 ~ 2
                - A15: swingO3<br> - frame: 0 ~ 2
                - A16: swingOF<br> - frame: 0 ~ 3
                - A17: swingP1<br> - frame: 0 ~ 2
                - A18: swingP2<br> - frame: 0 ~ 2
                - A19: swingPF<br> - frame: 0 ~ 3
                - A20: swingT1<br> - frame: 0 ~ 2
                - A21: swingT2<br> - frame: 0 ~ 2
                - A22: swingT3<br> - frame: 0 ~ 2
                - A23: swingTF<br> - frame: 0 ~ 3
                - A24: stabO1<br> - frame: 0 ~ 1
                - A25: stabO2<br> - frame: 0 ~ 1
                - A26: stabOF<br> - frame: 0 ~ 2
                - A27: stabT1<br> - frame: 0 ~ 2
                - A28: stabT2<br> - frame: 0 ~ 2
                - A29: stabTF<br> - frame: 0 ~ 3
                - A30: shoot1<br> - frame: 0 ~ 2
                - A31: shoot2<br> - frame: 0 ~ 4
                - A32: shootF<br> - frame: 0 ~ 2
                - A33: dead<br> - frame: 0
                - A34: ghostwalk<br> - frame: 0 ~ 3
                - A35: ghoststand<br> - frame: 0 ~ 2
                - A36: ghostjump<br> - frame: 0
                - A37: ghostproneStab<br> - frame: 0 ~ 1
                - A38: ghostladder<br> - frame: 0 ~ 1
                - A39: ghostrope<br> - frame: 0 ~ 1
                - A40: ghostfly<br> - frame: 0 ~ 1
                - A41: ghostsit<br> - frame: 0 ~ 0
              - emotion: Expressions (E00 ~ E24) 
                - E00: default (default)<br> - frame: 0
                - E01: wink<br> - frame: 0
                - E02: smile<br> - frame: 0
                - E03: cry<br> - frame: 0
                - E04: angry<br> - frame: 0
                - E05: bewildered<br> - frame: 0
                - E06: blink<br> - frame: 0 ~ 2
                - E07: blaze<br> - frame: 0 ~ 1
                - E08: bowing<br> - frame: 0 ~ 1
                - E09: cheers<br> - frame: 0
                - E10: chu<br> - frame: 0
                - E11: dam<br> - frame: 0 ~ 1
                - E12: despair<br> - frame: 0 ~ 1
                - E13: glitter<br> - frame: 0 ~ 1
                - E14: hit<br> - frame: 0
                - E15: hot<br> - frame: 0 ~ 1
                - E16: hum<br> - frame: 0 ~ 1
                - E17: love<br> - frame: 0 ~ 1
                - E18: oops<br> - frame: 0
                - E19: pain<br> - frame: 0
                - E20: troubled<br> - frame: 0
                - E21: qBlue<br> - frame: 0
                - E22: shine<br> - frame: 0
                - E23: stunned<br> - frame: 0
                - E24: vomit<br> - frame: 0 ~ 1
              - wmotion: Weapon motions (W00 ~ W04)
                - W00: Default motion (default, motion based on weapon type)
                - W01: One-handed motion
                - W02: Two-handed motion
                - W03: Gun motion
                - W04: No weapon
              - width: Horizontal length (corresponding to the background size, 96 (default) ~ 1000)
              - height: Vertical length (corresponding to the background size, 96 (default) ~ 1000)
              - x: Horizontal coordinate of the character (coordinate range 0 < x < width, 0 is the left starting point)
              - y: Vertical coordinate of the character (coordinate range 0 < y < height, 0 is the top starting point)
        character_date_create:
          type: string
          description: Character creation date (SGT, daily data with hours and minutes set to 0)
          example: "2025-01-21T00:00+08:00"
        access_flag:
          type: string
          description: Login status in the past 7 days (true:logged in, false:not logged in)
        liberation_quest_clear_flag:
          type: string
          description: Liberation Quest completion status (true:completed, false:not completed)<br>
                       * This parameter will be deprecated and removed from the MapleStory OpenAPI after January 2026.<br>
                       * Please use the newly added liberation_quest_clear parameter instead.
        liberation_quest_clear:
          type: string
          description: Liberation Quest completion status (0:not completed, 1:Genesis Weapon liberated, 2:Destiny Weapon Phase 1 liberated)
