 /maplestorysea/v1/character/skill:
    get:
      tags:
        - Character
      summary: Retrieve skill information
      description: Retrieves information about character skills and Hyper Skills.
      operationId: maplestory_get_character_skill
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
            type: string
        - name: ocid
          in: query
          description: Character identifier
          required: true
          schema:
            type: string
        - name: date
          in: query
          description: Reference date for query (SGT, YYYY-MM-DD)
          schema:
            type: string
        - name: character_skill_grade
          in: query
          description: |
            Job advancement tier to query
            - 0: 0th job skills and Zero shared skills
            - 1: 1st job skills
            - 1.5: 1.5th job skills
            - 2: 2nd job skills
            - 2.5: 2.5th job skills
            - 3: 3rd job skills
            - 4: 4th job skills and Zero Alpha/Beta skills
            - hyperpassive: Hyper passive skills
            - hyperactive: Hyper active skills
            - 5: 5th job skills
            - 6: 6th job skills
          required: true
          schema:
            type: string
            default: "1"
            enum:
              - "0"
              - "1"
              - "1.5"
              - "2"
              - "2.5"
              - "3"
              - "4"
              - "hyperpassive"
              - "hyperactive"
              - "5"
              - "6"
            
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterSkill'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
