openapi: 3.0.3
info:
  title: 히트2 API
  version: 1.0.0
  contact:
    name: help_openapi@nexon.co.kr
  description: |-
    - 히트2의 게임 데이터는 평균 10분 후 확인 가능합니다.
    - 2022년 8월 25일 이후 데이터를 조회할 수 있습니다.
    - 게임 콘텐츠 변경으로 ocid가 변경될 수 있습니다. ocid 기반 서비스 갱신 시 유의해 주시길 바랍니다. 

servers:
  - url: 'https://open.api.nexon.com'
tags:
  - name: Character 
    description: 캐릭터 정보 조회

paths:
  /hit2/v1/id:
    get:
      tags:
        - Character
      summary: 캐릭터 식별자(ocid) 조회
      description: 캐릭터 식별자(ocid)를 조회합니다.
      operationId: hit2_get_id
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
            type: string
        - name: character_name
          in: query
          description: 캐릭터 명
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /hit2/v1/character/basic:
    get:
      tags:
        - Character
      summary: 기본 정보 조회
      description: 기본 정보를 조회합니다.
      operationId: hit2_get_character_basic
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
            type: string
        - name: ocid
          in: query
          description: 캐릭터 식별자
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterBasic'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
                
components:
  schemas:
    Character:
      type: object
      properties:
        ocid:
          type: string
          description: 캐릭터 식별자
    CharacterBasic:
      type: object
      properties:
        server_name:
          type: string
          description: 서버 명
        character_name:
          type: string
          description: 캐릭터 명
        character_date_create:
          type: string
          description: 캐릭터 생성일 (UTC0, 일 단위 데이터로 시, 분, 초는 일괄 0으로 표기))
          example: "2023-12-14T00:00:00Z"
        character_last_login:
          type: string
          description: 캐릭터 마지막 로그인 일(시) (UTC0)
          example: "2023-12-14T08:28:35Z"
        character_last_logout:
          type: string
          description: 캐릭터 마지막 로그아웃 일(시) (UTC0)
          example: "2023-12-14T08:28:35Z"
        character_class_group_name:
          type: string
          description: 캐릭터 직업군 명
        character_class_name:
          type: string
          description: 캐릭터 직업 명
        character_level:
          type: number
          format: int64
          description: 캐릭터 레벨
       
    ErrorMessage:
      type: object
      properties:
        error:
          type: object
          properties:
            name:
              type: string
              description: 에러 명
            message:
              type: string
              description: 에러 설명 
