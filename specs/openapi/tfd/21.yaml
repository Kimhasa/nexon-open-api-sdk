components:
  schemas:
    DescendantResponse:
      type: array
      items:
        type: object
        properties:
          descendant_id:
            type: string
            description: 계승자 식별자
          descendant_name:
            type: string
            description: 계승자 이름
          descendant_group_id:
            type: string
            description: 계승자 그룹 식별자 (/meta/descendant-group API 참고)
          descendant_image_url:
            type: string
            description: 계승자 이미지 경로
          descendant_stat:
            type: array
            description: 계승자 스탯
            items:
              type: object
              properties:
                level:
                  type: number
                  format: int64
                  description: 레벨
                stat_detail:
                  type: array
                  description: 스탯 상세
                  items:
                    type: object
                    properties:
                      stat_id:
                        type: string
                        description: 스탯 유형 (/meta/stat API 참고)
                      stat_value:
                        type: number
                        format: double
                        description: 스탯 유형별 값
          descendant_skill:
            type: array
            description: 계승자 스킬 정보
            items:
              type: object
              properties:
                skill_type:
                  type: string
                  description: 스킬 유형 (액티브, 패시브)
                skill_name:
                  type: string
                  description: 스킬 이름
                element_type:
                  type: string
                  description: 스킬 유형
                arche_type:
                  type: string
                  description: 아르케 유형
                skill_image_url:
                  type: string
                  description: 스킬 아이콘 이미지 경로
                skill_description:
                  type: string
                  description: 스킬 설명

    WeaponResponse:
      type: array
      items:
        type: object
        properties:
          weapon_name:
            type: string
            description: 무기 이름
          weapon_id:
            type: string
            description: 무기 식별자
          image_url:
            type: string
            description: 무기 이미지 경로
          weapon_type:
            type: string
            description: 무기 유형
          weapon_category:
            type: string
            description: 무기 구분
          weapon_tier_id:
            type: string
            description: 무기 등급 (/meta/tier API 참고)
          weapon_rounds_type:
            type: string
            description: 무기 탄환 유형
          available_core_slot:
            type: array
            description: 오픈 가능한 코어 슬롯 목록 (/meta/core-slot API 참고)
            items:
              type: string
          base_stat:
            type: array
            description: 무기 기본 제원
            items:
              type: object
              properties:
                stat_id:
                  type: string
                  description: 무기 기본 제원 식별자 (/meta/stat API 참고)
                stat_value:
                  type: number
                  format: double
                  description: 무기 기본 제원 값
          firearm_atk:
            type: array
            description: 레벨별 총기 공격력
            items:
              type: object
              properties:
                level:
                  type: number
                  format: int64
                  description: 총기 레벨
                firearm:
                  type: array
                  description: 총기 공격력
                  items:
                    type: object
                    properties:
                      firearm_atk_type:
                        type: string
                        description: 총기 공격력 유형 (/meta/stat API 참고)
                      firearm_atk_value:
                        type: number
                        format: double
                        description: 총기 공격력 값
          weapon_perk_ability_name:
            type: string
            description: 고유 능력 이름
          weapon_perk_ability_description:
            type: string
            description: 고유 능력 설명
          weapon_perk_ability_image_url:
            type: string
            description: 고유 능력 아이콘 이미지 경로

    ModuleResponse:
      type: array
      items:
        type: object
        properties:
          module_name:
            type: string
            description: 모듈 이름
          module_id:
            type: string
            description: 모듈 식별자
          image_url:
            type: string
            description: 모듈 이미지 경로
          module_type:
            type: string
            description: 모듈 유형
          module_tier_id:
            type: string
            description: 모듈 등급 (/meta/tier API 참고)
          module_socket_type:
            type: string
            description: 모듈 슬롯 소켓 유형
          module_class:
            type: string
            description: 모듈 클래스
          available_weapon_type:
            type: array
            items:
              type: string
            description: 모듈 장착 가능 무기 유형 목록 (/meta/weapon-type API 참고)
          available_descendant_id:
            type: array
            items:
