      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterStat'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /baram/v1/character/guild:
    get:
      tags:
        - Character
      summary: 가입한 길드 정보 조회
      description: 가입한 길드(문파) 정보를 조회합니다.
      operationId: baram_get_character_guild
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
