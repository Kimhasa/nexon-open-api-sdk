                $ref: '#/components/schemas/CharacterItemEquipment'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /baram/v1/character/stat:
    get:
      tags:
        - Character
      summary: 능력치 정보 조회
      description: 능력치 정보를 조회합니다.
      operationId: baram_get_character_stat
      parameters:
        - name: x-nxopen-api-key
          in: header
