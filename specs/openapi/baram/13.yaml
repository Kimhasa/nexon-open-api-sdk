components:
  schemas:
    Character:
      type: object
      properties:
        ocid:
          type: string
          description: 캐릭터 식별자
    CharacterBasic:
      type: object
      properties:
        character_name:
          type: string
          description: 캐릭터 명
        character_date_create:
          type: string
          description: 캐릭터 생성 일(시) (UTC0)
          example: "2023-12-14T08:28:35Z"
        character_create_type_name:
          type: string
          description: 캐릭터 생성 타입 명
        character_class_name:
          type: string
          description: 캐릭터 직업 명
        character_nation_name:
          type: string
          description: 캐릭터 국가 명
        character_gender:
          type: string
          description: 캐릭터 성별
        character_exp:
          type: number
          format: int64
          description: 캐릭터 경험치
        character_level:
          type: number
          format: int64
          description: 캐릭터 레벨
          
    CharacterTitle: 
      type: object
      properties:
        title:
          type: array
          description: 칭호 정보
          items:
            properties:
              title_id:
                type: string
                description: 칭호 명
              date_expire:
                type: string
                description: 칭호 만료 일(시) (UTC0)  
                example: "2023-12-14T08:28:35Z"

    CharacterTitleEquipment: 
      type: object
      properties:
        title_equipment:
          type: array
          description: 장착 칭호 정보
          items:
            properties:
              title_id:
                type: string
                description: 장착 칭호 명
              date_expire:
                type: string
                description: 장착 칭호 만료 일(시) (UTC0)
                example: "2023-12-14T08:28:35Z"
                
    CharacterItemEquipment:
      type: object
      properties:
        item_equipment:
          type: array
          description: 장착 아이템 정보
          items:
            properties:
              item_id:
                type: string
                description: 장착 아이템 명
              item_equipment_slot_name:
                type: string
                description: 장착 아이템 페이지 슬롯 명
    CharacterStat: 
      type: object
      properties:
        stat:
          type: array
          description: 능력치 정보
          items:
            properties:
              stat_name:
                type: string
                description: 능력치 명
              stat_value:
                type: string
                description: 능력치 값  

    CharacterGuild:
      type: object
      properties:
        guild_name:
          type: string
          description: 가입한 문파(길드) 명
          
    ErrorMessage:
      type: object
      properties:
        error:
          type: object
          properties:
            name:
              type: string
              description: 에러 명
            message:
              type: string
              description: 에러 설명 
