openapi: 3.0.3
info:
  title: 서든어택 API
  version: 1.0.0
  contact:
    name: help_openapi@nexon.co.kr
  description: |-
    - 서든어택의 게임 데이터는 평균 10분 후 확인 가능합니다.
    - 2025년 1월 24일 이후 데이터를 조회할 수 있습니다.
    - 게임 콘텐츠 변경으로 ouid가 변경될 수 있습니다. ouid 기반 서비스 갱신 시 유의해 주시길 바랍니다.
      
servers:
  - url: 'https://open.api.nexon.com'
  
tags:
  - name: Match 
    description: 매치 정보 조회

paths:
  /suddenattack/v1/match:
    get:
      tags:
        - Match
      summary: 매치 목록 조회
      description: 유저의 최근 매치 목록을 조회합니다.<br>- 매치는 최대 1000개까지 조회 가능합니다.
      operationId: suddenattack_get_match
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
            type: string
        - name: ouid
          in: query
          description: 계정 식별자
          required: true
          schema:
            type: string
        - name: match_mode
          in: query
          description: 게임 모드
          required: true
          schema:
            type: string
            enum:
              - 개인전
              - 데스매치
              - 폭파미션
              - 진짜를 모아라
        - name: match_type
          in: query
          description: 매치 유형
          schema:
            type: string
            enum:
              - 일반전
              - 클랜전
              - 퀵매치 클랜전
              - 클랜 랭크전
              - 랭크전 솔로
              - 랭크전 파티
              - 토너먼트
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /suddenattack/v1/match-detail:
    get:
      tags:
        - Match
      summary: 매치 상세 기록 조회
      description: 매치 고유 식별자(match_id)로 매치의 상세 정보를 조회합니다.
      operationId: suddenattack_get_match_detail
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
            type: string
        - name: match_id
          in: query
          description: 매치 고유 식별자
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchDetail'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'


components:
  schemas:          
    Match:
      type: object
      properties:
        match:
          type: array
          description: 매치 목록
          items:
            type: object
            properties:
              match_id:
                type: string
                description: 매치 고유 식별자
              match_type:
                type: string
                description: 매치 유형
              match_mode:
                type: string
                description: 게임 모드
              date_match:
                type: string
                description: 매치 생성 일(시) (UTC0)
                example: "2023-12-14T08:28:35Z"
              match_result:
                type: string
                description: |-
                  매치 결과 
                  - 매치 결과는 기본적으로 1: 승리, 2: 패배, 3: 무승부로 기록됩니다.
                  - 진짜를 모아라 모드는 승리 및 패배 여부가 기록되지 않습니다.
                  - 개인전 및 진짜를 모아라 모드에서는 킬 수가 높은 순으로 순위가 결정되며, 동일한 킬 수일 경우 데스 수가 적은 순으로 순위가 산정됩니다.
              kill:
                type: number
                format: int64
                description: 킬 기록
              death:
                type: number
                format: int64
                description: 데스 기록
              assist:
                type: number
                format: int64
                description: 어시스트 기록
    MatchDetail:
      type: object
      properties:
        match_id:
          type: string
          description: 매치 고유 식별자
        match_type:
          type: string
          description: 매치 유형
        match_mode:
          type: string
          description: 게임 모드
        date_match:
          type: string
          description: 매치 생성 일(시) (UTC0)
          example: "2023-12-14T08:28:35Z"
        match_map:
          type: string
          description: 맵
        match_detail:
          type: array
          description: 매치 참여 유저 정보
          items:
            type: object
            properties:
              team_id:
                type: string
                description: 팀 정보
              match_result:
                type: string
                description: |-
                  매치 결과 
                  - 매치 결과는 기본적으로 1: 승리, 2: 패배, 3: 무승부로 기록됩니다.
                  - 진짜를 모아라 모드는 승리 및 패배 여부가 기록되지 않습니다.
                  - 개인전 및 진짜를 모아라 모드에서는 킬 수가 높은 순으로 순위가 결정되며, 동일한 킬 수일 경우 데스 수가 적은 순으로 순위가 산정됩니다.
              user_name:
                type: string
                description: 닉네임
              season_grade:
                type: string
                description: 시즌 계급
              clan_name:
                type: string
                description: 클랜 이름<br>-클랜전, 퀵매치 클랜전, 클랜 랭크전에서만 노출
              kill:
                type: number
                format: int64
                description: 킬 기록
              death:
                type: number
                format: int64
                description: 데스 기록
              headshot:
                type: number
                format: int64
                description: 헤드샷 기록
              damage:
                type: number
                format: double
                description: 데미지 기록
              assist:
                type: number
                format: int64
                description: 어시스트 기록

    ErrorMessage:
      type: object
      properties:
        error:
          type: object
          properties:
            name:
              type: string
              description: 에러 명
            message:
              type: string
              description: 에러 설명