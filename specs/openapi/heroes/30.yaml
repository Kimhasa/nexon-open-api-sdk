openapi: 3.0.3
info:
  title: 마비노기 영웅전 API
  version: 1.0.0
  contact:
    name: help_openapi@nexon.co.kr
  description: |-
    - 마비노기 영웅전의 게임 데이터는 평균 10분 후 확인 가능합니다.
      
servers:
  - url: 'https://open.api.nexon.com'
  
tags:
  - name: Marketplace 
    description: 거래소 정보 조회

paths:
   /heroes/v2/marketplace/market-history:
    get:
      tags:
        - Marketplace
      summary: 최근 1주 아이템 거래 기록 조회
      description: |-
        아이템의 최근 1주 거래 기록을 조회합니다. 
        - 현재 평균가는 마지막으로 갱신된 거래 기록의 평균 거래가로 확인 가능합니다.
        - 최근 24시간 내 10건 이상의 거래가 발생한 아이템의 거래 기록이 조회됩니다. 
        - 각 인챈트 스크롤 아이템은 "인챈트 스크롤", "인챈트 스크롤 (무기한)"으로 검색 후 아이템 세부 옵션의 prefix_enchant_preset 또는 suffix_enchant_preset에서 인챈트 스크롤 종류를 확인하실 수 있습니다.
        - 골드 거래소의 거래 내역이 포함되며, 100만 골드 당 가격 기준으로 조회됩니다. (2024년 12월 19일 추가) 
      operationId: heroes_get_marketplace_history
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
            type: string
        - name: item_name
          in: query
          description: 아이템 명
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: |
            페이징 처리를 위한 cursor 
            - 최근 1주 데이터 제공. 페이징 시 페이지 당 500개 제공  
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketHistory'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

   /heroes/v2/marketplace/gold-market-buy-top-30:
    get:
      tags:
        - Marketplace
      summary: 최근 1주 골드 구매 상위 30명의 구매량 정보
      description: 최근 1주 동안 골드 거래소에서 골드 구매량이 가장 많은 상위 30명 유저의 골드 구매량을 조회합니다.
      operationId: heroes_get_gold_market_buy_top_30
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
            type: string

      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoldMarketBuyTop30'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

   /heroes/v2/marketplace/gold-market-sell-top-30:
    get:
      tags:
        - Marketplace
      summary:  최근 1주 골드 판매 상위 30명의 판매량 정보
      description: 최근 1주 동안 골드 거래소에서 골드 판매량이 가장 많은 상위 30명 유저의 골드 판매량을 조회합니다.
      operationId: heroes_get_gold_market_sell_top_30
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
            type: string

      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoldMarketSellTop30'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

components:
  schemas:          
    MarketHistory:
      type: object
      properties:
        next_cursor:
          type: string
          description: 페이징 처리를 위한 cursor
        item:
          type: array
          description: 거래 아이템 정보  
          items:
            type: object
            properties:
              date_update:
                type: string
                description: 갱신 일(시) (UTC0)
                example: "2023-12-14T08:28:35Z"
              item_name:
                type: string
                description: 장착 아이템 명
              average_price:
                type: number
                format: int64
                description: 평균 거래가  
              min_price:
                type: number
                format: int64
                description: 최소 거래가  
              max_price:
                type: number
                format: int64
                description: 최대 거래가  
              item_option:
                type: object
                description: 아이템 옵션 정보
                properties:
                  enhancement_level:
                    type: number
                    format: int64
                    description: 강화 단계
                  tuning_stat:
                    type: array
                    description: 아이템 연마 능력치
                    items:
                      type: object
                      properties:
                        stat_name:
                          type: string
                          description: 능력치 명
                        stat_value:
                          type: string
                          description: 능력치 증가량
                  ability_name:
                    type: string
                    description: 장비에 부여된 어빌리티 명  
                  prefix_enchant_preset_1:
                    type: string
                    description: 1번 프리셋 접두 인챈트 명
                  suffix_enchant_preset_1:
                    type: string
                    description: 1번 프리셋 접미 인챈트 명
                  prefix_enchant_preset_2:
                    type: string
                    description: 2번 프리셋 접두 인챈트 명
                  suffix_enchant_preset_2:
                    type: string
                    description: 2번 프리셋 접미 인챈트 명
                  power_infusion_preset_1:
                    type: array
                    description: 1번 프리셋 정령합성 능력치
                    items:
                      type: object
                      properties:
                        stat_name:
                          type: string
                          description: 능력치 명
                        stat_value:
                          type: string
                          description: 능력치 증가량
                  power_infusion_preset_2:
                    type: array
                    description: 2번 프리셋 정령합성 능력치
                    items:
                      type: object
                      properties:
                        stat_name:
                          type: string
                          description: 능력치 명
                        stat_value:
                          type: string
                          description: 능력치 증가량                            
                  bind_release_limit:
                    type: string
                    description: 아이템 귀속 해제 제한 횟수
                    example: "2023-12-14T08:28:35Z"
                  item_shape_name:
                    type: string
                    description: 매혹의 룬(변경한 외형의 아이템 명)
                  item_quality:
                    type: string
                    description: 아이템 품질
                  bracelet_gem_composite:
                    type: array
                    description: 팔찌 보석 장착 정보
                    items:
                      type: object
                      properties:
                        item_name:
                          type: string
                          description: 장착 보석 명
                        stat:
                          type: array
                          description: 능력치
                          items:
                            type: object
                            properties:
                              stat_name:
                                type: string
                                description: 능력치 명
                              stat_value:
                                type: string
                                description: 능력치 증가량
                  value:
                    type: string
                    description: 기타 아이템 속성

    GoldMarketBuyTop30:
      type: object
      properties:
        buy_gold:
          type: array
          description: 최근 1주 골드 거래소의 골드 구매 상위 30명 유저의 구매량 정보   
          items:
            type: object
            properties:
              cairde_name:
                type: string
                description: 카르제 이름
              total_buy_gold:
                type: number
                format: int64
                description: 최근 1주 구매한 골드 총량

    GoldMarketSellTop30:
      type: object
      properties:
        sell_gold:
          type: array
          description: 최근 1주 골드 거래소의 골드 판매 상위 30명 유저의 판매량 정보
          items:
            type: object
            properties:
              cairde_name:
                type: string
                description: 카르제 이름
              total_sell_gold:
                type: number
                format: int64
                description: 최근 1주 판매한 골드 총량

    ErrorMessage:
      type: object
      properties:
        error:
          type: object
          properties:
            name:
              type: string
              description: 에러 명
              example: string
            message:
              type: string
              description: 에러 설명
              example: string
