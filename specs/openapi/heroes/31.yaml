openapi: 3.0.3
info:
  title: 마비노기 영웅전 API
  version: 1.0.0
  contact:
    name: help_openapi@nexon.co.kr

      
servers:
  - url: 'https://open.api.nexon.com'
  
tags:
  - name: Ranking 
    description: 랭킹 정보 조회

paths:
  /heroes/v2/ranking/hall-of-honor:
    get:
      tags:
        - Ranking
      summary: 명예의 전당 랭킹 조회
      description: |-
       - 명예의 전당 랭킹 정보를 조회합니다. 
       - 명예의 전당 랭킹은 매일 오전 9시 실시간 랭킹 순위를 기준으로 반영됩니다.
      operationId: heroes_get_ranking_hall_of_honor
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
            type: string
        - name: ranking_type
          in: query
          description: |
            랭킹 유형
            - 0 : 공격력 기준 순위
              - 공격력 200위까지 조회 가능합니다.
            - 1 : 마법 공격력 기준 순위
              - 마법 공격력 100위까지 조회 가능합니다.
          required: true
          schema:
            type: string
            enum:
              - "0"
              - "1" 

      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingHallOfHonor'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /heroes/v2/ranking/real-time:
    get:
      tags:
        - Ranking
      summary: 실시간 랭킹 조회
      description: |-
       - 실시간 랭킹 정보를 조회합니다. 
       - 실시간 랭킹 정보는 1시간마다 반영됩니다.
      operationId: heroes_get_ranking_real_time
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
            type: string
        - name: ranking_type
          in: query
          description: |
            랭킹 유형
            - 0 : 공격력 기준 순위
              - 공격력 4000위까지 조회 가능합니다.
            - 1 : 마법 공격력 기준 순위
              - 마법 공격력 2000위까지 조회 가능합니다.
          required: true
          schema:
            type: string
            enum:
              - "0"
              - "1" 
        - name: page_no
          in: query
          description: |
            페이지 번호
            - 한 페이지 당 최대 500개의 데이터가 조회됩니다. 
          required: true
          schema:
            type: number
            format: int64   

      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingRealTime'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'


components:
  schemas:
    RankingHallOfHonor:
      type: array
      description: 랭킹 정보
      items:
        type: object
        properties:
          ranking_type:
            type: string
            description: |
              랭킹 유형
              - 0 : 공격력 기준 순위
              - 1 : 마법 공격력 기준 순위
          ranking:
            type: number
            format: int64
            description: 랭킹 순위
          character_name:
            type: string
            description: 캐릭터 명
          score:
            type: number
            format: int64
            description: 스코어

    RankingRealTime:
      type: array
      description: 랭킹 정보
      items:
        type: object
        properties:
          ranking_type:
            type: string
            description: |
              랭킹 유형
              - 0 : 공격력 기준 순위
              - 1 : 마법 공격력 기준 순위
          ranking:
            type: number
            format: int64
            description: 랭킹 순위
          character_name:
            type: string
            description: 캐릭터 명
          score:
            type: number
            format: int64
            description: 스코어

    ErrorMessage:
      type: object
      properties:
        error:
          type: object
          properties:
            name:
              type: string
              description: 에러 명
              example: string
            message:
              type: string
              description: 에러 설명
              example: string
