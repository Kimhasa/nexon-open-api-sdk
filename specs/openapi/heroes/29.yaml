  /heroes/v2/character/guild:
    get:
      tags:
        - Character
      summary: 가입/신청한 길드 정보 조회
      description: 가입/신청한 길드 정보를 조회합니다.
      operationId: heroes_get_character_guild
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
            type: string
        - name: ocid
          in: query
