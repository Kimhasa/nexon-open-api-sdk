  /heroes/v2/meta/enchant:
    get:
      tags:
        - MetaData
      summary: 인챈트 메타 데이터 조회
      description: 인챈트 명을 입력하여 인챈트 등급 및 능력치를 조회합니다.
      operationId: heroes_get_meta_enchant
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
            type: string
        - name: enchant_type
          in: query
          description: |
            접두/접미 타입
            - 0 : 접두 인챈트
            - 1 : 접미 인챈트
          required: true
          schema:
            type: string
            enum:
              - "0"
              - "1"            
        - name: enchant_name
          in: query
          description: 인챈트 명
          required: true
          schema:
            type: string


      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnchantMeta'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'


components:
  schemas:
    Character:
      type: object
      properties:
        ocid:
          type: string
          description: 캐릭터 식별자
          
    CharacterBasic:
      type: object
      properties:
        character_name:
          type: string
          description: 영웅(캐릭터) 명
        character_date_create:
          type: string
          description: 영웅(캐릭터) 생성 일(시) (UTC0)
          example: "2023-12-14T08:28:35Z"      
        access_flag:
          type: string
          description: 최근 7일간 접속 여부 (true 접속, false 미접속)
          example: "true"
        character_class_name:
          type: string
          description: 영웅(캐릭터) 직업 명
        character_gender:
          type: string
          description: 영웅(캐릭터) 성별
        character_exp:
          type: number
          format: int64
          description: 영웅(캐릭터) 경험치
        character_level:
          type: number
          format: int64
          description: 영웅(캐릭터) 레벨
        cairde_name:
          type: string
          description: 카르제 이름
        title_count:
          type: number
          format: int64
          description: 획득한 내 타이틀 개수       
        id_title_count:
          type: number
          format: int64
          description: 내 타이틀로 획득하지 않은 ID 타이틀 개수   
        total_title_count:
          type: number
          format: int64
          description: 획득한 모든 타이틀 총 개수   
        title_stat:
          type: array
          description: 타이틀로 오른 능력치의 합계 정보 
          items:
            type: object
            properties:
              stat_name:
                type: string
                description: 타이틀로 오른 능력치 명  
              stat_value:
                type: string
                description: 타이틀로 오른 능력치 값    
        skill_awakening:
          type: array
          description: 각성의 돌이 적용된 스킬 목록과 스킬 별 각성의 돌 정보  
          items:
            type: object
            properties:
              skill_name:
                type: string
                description: 스킬 명
              item_name:
                type: string
                description: 사용된 각성의 돌  
        dress_point:
          type: object
          description: 드레스 수집 포인트 정보
          properties:
            total_point:
              type: number
              format: int64
              description: 드레스 수집 포인트
            avatar_point:
              type: number
              format: int64
              description: 아바타 수집 포인트
            back_point:
              type: number
              format: int64
              description: 등 수집 포인트
            tail_point:
              type: number
              format: int64
              description: 꼬리 수집 포인트
            object_point:
              type: number
              format: int64
              description: 오브젝트 수집 포인트
          
    CharacterTitle: 
      type: object
      properties:
        title:
          type: array
          description: 타이틀/문양 정보
          items:
            type: object
            properties:
              title_type:
                type: string
                description: 타이틀 타입 (title:타이틀, pattern:문양)
              title_name:
                type: string
                description: 타이틀/문양 명
            
    CharacterTitleEquipment: 
      type: object
      properties:
        title_equipment:
          type: array
          description: 장착 타이틀/문양 정보
          items:
            properties:
              title_equipment_type_name:
                type: string
                description: 장착 타이틀/문양 장착 위치 명
              title_type:
                type: string
                description: 장착 타이틀 타입 (title:타이틀, pattern:문양)
              title_name:
                type: string
                description: 장착 타이틀/문양 명

    CharacterItemEquipment:
      type: object
      properties:
        item_equipment:
          type: array
          description: 장착 아이템 정보
          items:
            type: object
            properties:
              item_equipment_page:
                type: string
                description: 장착 아이템 장착 페이지 (Bag:장착소지품, Cash:캐시소지품)
              item_equipment_slot_name:
                type: string
                description: 장착 아이템 슬롯 명
              item_name:
                type: string
                description: 장착 아이템 명
              item_option:
                type: object
                description: 아이템 옵션 정보
                properties:
                  enhancement_level:
                    type: number
                    format: int64
                    description: 강화 단계
                  tuning_stat:
                    type: array
                    description: 아이템 연마 능력치
                    items:
                      type: object
                      properties:
                        stat_name:
                          type: string
                          description: 능력치 명
                        stat_value:
                          type: string
                          description: 능력치 증가량
                  ability_name:
                    type: string
                    description: 장비에 부여된 어빌리티 명
                  prefix_enchant_use_preset_no:
                    type: number
                    format: int64
                    description: |
                      활성화된 접두 인챈트 프리셋  
                      - 프리셋 정보는 장비를 장착 또는, 게임 재접속시 갱신됩니다. 
                  suffix_enchant_use_preset_no:
                    type: number
                    format: int64
                    description: |
                      활성화된 접미 인챈트 프리셋  
                      - 프리셋 정보는 장비를 장착 또는, 게임 재접속시 갱신됩니다. 
                  prefix_enchant_preset_1:
                    type: string
                    description: 1번 프리셋 접두 인챈트 명
                  suffix_enchant_preset_1:
                    type: string
                    description: 1번 프리셋 접미 인챈트 명
                  prefix_enchant_preset_2:
                    type: string
                    description: 2번 프리셋 접두 인챈트 명
                  suffix_enchant_preset_2:
                    type: string
                    description: 2번 프리셋 접미 인챈트 명
                  power_infusion_use_preset_no:
                    type: number
                    format: int64
                    description: |
                      활성화된 정령합성 프리셋  
                      - 프리셋 정보는 장비를 장착 또는, 게임 재접속시 갱신됩니다. 
                  power_infusion_preset_1:
                    type: array
                    description: 1번 프리셋 정령합성 능력치
                    items:
                      type: object
                      properties:
                        stat_name:
                          type: string
                          description: 능력치 명
                        stat_value:
                          type: string
                          description: 능력치 증가량
                  power_infusion_preset_2:
                    type: array
                    description: 2번 프리셋 정령합성 능력치
                    items:
                      type: object
                      properties:
                        stat_name:
                          type: string
                          description: 능력치 명
                        stat_value:
                          type: string
                          description: 능력치 증가량
                  cash_item_color:
                    type: object
                    description: 캐시 아이템 및 이너아머 색상 정보  
                    properties:
                      color_1:
                        type: string
                        description: 색상 파트 1
                      color_2:
                        type: string
                        description: 색상 파트 2
                      color_3:
                        type: string
                        description: 색상 파트 3
                      color_4:
                        type: string
                        description: 색상 파트 4
                      color_5:
                        type: string
                        description: 색상 파트 5
                  avatar_color_use_preset_no:
                    type: number
                    format: int64
                    description: 사용 중인 아바타 및 아바타 하의 이너아머 아이템 색상 정보 프리셋
                  avatar_color_preset_1:
                    type: object
                    description: 1번 아바타 색상 정보 프리셋   
                    properties:
                      color_1:
                        type: string
                        description: 색상 파트 1
                      color_2:
                        type: string
                        description: 색상 파트 2
                      color_3:
                        type: string
                        description: 색상 파트 3
                      color_4:
                        type: string
                        description: 색상 파트 4
                      color_5:
                        type: string
                        description: 색상 파트 5
                  avatar_color_preset_2:
                    type: object
                    description: 2번 아바타 색상 정보 프리셋  
                    properties:
                      color_1:
                        type: string
                        description: 색상 파트 1
                      color_2:
                        type: string
                        description: 색상 파트 2
                      color_3:
                        type: string
                        description: 색상 파트 3
                      color_4:
                        type: string
                        description: 색상 파트 4
                      color_5:
                        type: string
                        description: 색상 파트 5
                  avatar_color_preset_3:
                    type: object
                    description: 3번 아바타 색상 정보 프리셋    
                    properties:
                      color_1:
                        type: string
                        description: 색상 파트 1
                      color_2:
                        type: string
                        description: 색상 파트 2
                      color_3:
                        type: string
                        description: 색상 파트 3
                      color_4:
                        type: string
