openapi: 3.0.3
info:
  title: 마비노기 영웅전 API
  version: 1.0.0
  contact:
    name: help_openapi@nexon.co.kr
  description: |-
    - 마비노기 영웅전의 게임 데이터는 평균 10분 후 확인 가능합니다.
    - 2022년 1월 1일 이후 데이터를 조회할 수 있습니다. (단, 2022년 1월 이전에 발생한 데이터는 응답 결과에 포함되지 않을 수 있음)
    - 게임 콘텐츠 변경으로 ocid가 변경될 수 있습니다. ocid 기반 서비스 갱신 시 유의해 주시길 바랍니다.
      
servers:
  - url: 'https://open.api.nexon.com'
  
tags:
  - name: Character 
    description: 캐릭터 정보 조회 V2
  - name: MetaData 
    description: 메타데이터 정보 조회

paths:
  /heroes/v2/id:
  
    get:
      tags:
        - Character
      summary: 캐릭터 식별자(ocid) 조회
      description: 캐릭터 식별자(ocid)를 조회합니다.
      operationId: heroes_get_id
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
            type: string
        - name: character_name
          in: query
          description: 영웅(캐릭터) 명
          required: true
          schema:
            type: string
            
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
                
  /heroes/v2/character/basic:
    get:
      tags:
        - Character
      summary: 기본 정보 조회
      description: 기본 정보를 조회합니다. <br>
        버프, 아이템 사용 등으로 적용된 효과로 경험치 또는 레벨이 게임 내 데이터와 상이할 수 있습니다.

      operationId: heroes_get_character_basic
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
            type: string
        - name: ocid
          in: query
          description: 캐릭터 식별자 
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterBasic'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
                
  /heroes/v2/character/title:
    get:
      tags:
        - Character
      summary: 타이틀/문양 보유 정보 조회
      description: 타이틀/문양 보유 정보를 조회합니다.<br>타이틀 타입(title_type)은 2023년 11월 23일 이후 획득(장착)한 타이틀/문양에 한해 조회할 수 있습니다.
      operationId: heroes_get_character_title
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
            type: string
        - name: ocid
          in: query
          description: 캐릭터 식별자
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterTitle'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /heroes/v2/character/title-equipment:
    get:
      tags:
        - Character
      summary: 장착 타이틀/문양 정보 조회
      description: 장착 타이틀/문양 정보를 조회합니다.<br>타이틀 타입(title_type)은 2023년 11월 23일 이후 획득(장착)한 타이틀/문양에 한해 조회할 수 있습니다.
      operationId: heroes_get_character_title-equipment
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
            type: string
        - name: ocid
          in: query
          description: 캐릭터 식별자
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterTitleEquipment'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /heroes/v2/character/item-equipment:
    get:
      tags:
        - Character
      summary: 장착 아이템 정보 조회
      description: 장착 아이템 정보를 조회합니다.
      operationId: heroes_get_character_item_equipment
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
            type: string
        - name: ocid
          in: query
          description: 캐릭터 식별자
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterItemEquipment'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /heroes/v2/character/stat:
    get:
      tags:
        - Character
      summary: 능력치 정보 조회
      description: 능력치 정보를 조회합니다.
      operationId: heroes_get_character_stat
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
