name: Set up Node and install dependencies
description: Install lockfile dependencies with Corepack and a Yarn package cache

inputs:
  node-version:
    description: Node.js version
    required: false
    default: '24'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        check-latest: true

    # Node 25부터 Corepack은 Node.js 배포본에 포함되지 않는다.
    - name: Install Corepack
      shell: bash
      run: npm install --global corepack@0.36.0

    - name: Locate Yarn cache
      id: yarn-cache
      shell: bash
      run: |
        CACHE_FOLDER=$(corepack yarn config get cacheFolder)
        echo "path=$CACHE_FOLDER" >> "$GITHUB_OUTPUT"

    - name: Cache Yarn packages
      uses: actions/cache@v6
      with:
        path: ${{ steps.yarn-cache.outputs.path }}
        key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}
        restore-keys: yarn-${{ runner.os }}-${{ runner.arch }}-

    # Yarn이 현재 Node 버전에 맞춰 node_modules를 구성한다. 캐시 미스도 허용한다.
    - name: Install dependencies
      shell: bash
      run: corepack yarn install --immutable
