name: API Monitor

# 넥슨 Open API 포털 변경 감지
# L1: 새 게임 추가/삭제
# L2: 카테고리 추가/삭제

on:
  schedule:
    # 매주 월요일 00:00 UTC (한국시간 09:00)
    - cron: '0 0 * * 1'
  workflow_dispatch: # 수동 실행 가능

permissions:
  issues: write
  contents: read

jobs:
  monitor:
    name: Check Nexon API Portal
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run monitor script
        id: monitor
        run: npx tsx scripts/api-monitor.ts

      - name: Check for existing issue
        if: steps.monitor.outputs.changes_detected == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --label "api-change" --state open --json number --jq 'length')
          echo "has_open_issue=$([ "$EXISTING" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Create issue
        if: steps.monitor.outputs.changes_detected == 'true' && steps.existing.outputs.has_open_issue != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGES_COUNT: ${{ steps.monitor.outputs.changes_count }}
          CHANGES_SUMMARY: ${{ steps.monitor.outputs.changes_summary }}
        run: |
          gh issue create \
            --title "🔔 넥슨 API 포털 변경 감지 (${CHANGES_COUNT}건)" \
            --label "api-change" \
            --body "$(cat <<EOF
          ## 변경 감지 내역

          ${CHANGES_SUMMARY}

          ## 확인 필요 사항

          - [ ] 넥슨 포털에서 변경 내용 직접 확인
          - [ ] 필요시 \`specs/\` 스펙 파일 업데이트
          - [ ] 필요시 SDK 코드 반영
          - [ ] \`scripts/api-snapshot.json\` 스냅샷 업데이트

          ## 참고 링크

          - [넥슨 Open API 포털](https://openapi.nexon.com/ko/game/)
          - [워크플로우 실행 로그](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

          ---
          🤖 이 이슈는 API Monitor 워크플로우에 의해 자동 생성되었습니다.
          EOF
          )"

      - name: Update existing issue
        if: steps.monitor.outputs.changes_detected == 'true' && steps.existing.outputs.has_open_issue == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGES_SUMMARY: ${{ steps.monitor.outputs.changes_summary }}
        run: |
          ISSUE_NUMBER=$(gh issue list --label "api-change" --state open --json number --jq '.[0].number')
          gh issue comment "$ISSUE_NUMBER" \
            --body "$(cat <<EOF
          ## 추가 변경 감지 ($(date -u +%Y-%m-%d))

          ${CHANGES_SUMMARY}

          [워크플로우 로그](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          EOF
          )"
