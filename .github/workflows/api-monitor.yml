name: API Monitor

on:
  schedule:
    # 매주 월요일 00:00 UTC (한국시간 09:00)
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '현재 ref에서 수집과 검증만 실행'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: api-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      HUSKY: '0'
      UPDATE_BRANCH: specs/auto-update
    outputs:
      pr_number: ${{ steps.publish.outputs.pr_number }}
      branch: ${{ steps.publish.outputs.branch }}
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.dry_run && github.ref || 'main' }}
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Fetch and compare snapshots
        id: check
        run: |
          git show HEAD:specs/openapi/index.json > "$RUNNER_TEMP/specs-base.json"
          corepack yarn specs:fetch
          corepack yarn specs:check --manifest "$RUNNER_TEMP/specs-base.json" \
            --current specs/openapi/index.json --report "$RUNNER_TEMP/specs-check.md"
          corepack yarn specs:notices --report "$RUNNER_TEMP/specs-notices.md"
          git add -- specs/openapi specs/notices.json
          if git diff --cached --quiet; then
            echo 'update=false' >> "$GITHUB_OUTPUT"
          else
            echo 'update=true' >> "$GITHUB_OUTPUT"
            echo "fingerprint=$(git diff --cached --binary | git hash-object --stdin)" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate structural report and commit locally
        if: steps.check.outputs.update == 'true'
        id: diff
        run: |
          corepack yarn specs:diff --base HEAD > "$RUNNER_TEMP/specs-diff.md"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            -c core.hooksPath=/dev/null commit -m 'chore(specs): 넥슨 포털 스펙 갱신'

      # GITHUB_TOKEN에서 파생된 push는 CI를 시작하지 않는다. 토큰이 만든 PR의 자동 CI도 승인이 필요하다.
      # https://docs.github.com/en/actions/concepts/security/github_token#when-github_token-triggers-workflow-runs
      - name: Verify refreshed snapshot
        if: steps.check.outputs.update == 'true'
        id: verify
        run: |
          run_gate() {
            local label="$1" log="$2" status=0
            shift 2
            "$@" > "$log" 2>&1 || status=$?
            if [ "$status" -eq 0 ]; then
              printf '| `%s` | 통과 |\n' "$label"
            else
              printf '| `%s` | 실패 (%s) |\n' "$label" "$status"
              tail -n 30 "$log" >&2
              failed=1
            fi
          }
          failed=0
          {
            printf '## 스펙 브랜치 검증\n\n| 명령 | 결과 |\n| --- | --- |\n'
            run_gate type-check "$RUNNER_TEMP/specs-type-check.log" corepack yarn type-check
            run_gate test "$RUNNER_TEMP/specs-test.log" corepack yarn test
            run_gate specs:drift "$RUNNER_TEMP/specs-drift.md" corepack yarn specs:drift --summary
          } > "$RUNNER_TEMP/specs-gates.md"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Assemble PR body and workflow summary
        if: steps.check.outputs.update == 'true'
        env:
          FINGERPRINT: ${{ steps.check.outputs.fingerprint }}
          MAJOR: ${{ steps.diff.outputs.major_count }}
          DEPRECATE: ${{ steps.diff.outputs.deprecate_count }}
          MINOR: ${{ steps.diff.outputs.minor_count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            printf '<!-- specs-auto-fingerprint:%s -->\n\n' "$FINGERPRINT"
            printf '[워크플로 실행 로그](%s)\n\n' "$RUN_URL"
            printf '스키마 변경 · **MAJOR %s · DEPRECATE %s · MINOR %s**\n\n' "$MAJOR" "$DEPRECATE" "$MINOR"
            cat "$RUNNER_TEMP/specs-gates.md"
            printf '\n## SDK 반영 체크리스트\n\n'
            printf '%s\n' \
              '- [ ] MINOR 변경을 호환되는 타입·메서드에 반영하고 테스트한다.' \
              '- [ ] DEPRECATE 변경에 @deprecated를 붙이고 optional로 완화하거나 메서드 호출 시 런타임 경고를 추가한다.' \
              '- [ ] MAJOR 변경의 호환성, 마이그레이션 경로와 적용 버전을 검토한다.' \
              '- [ ] CHANGELOG와 버전을 검토한다.'
            printf '\n'
            cat "$RUNNER_TEMP/specs-notices.md"
            if [ ! -s "$RUNNER_TEMP/specs-drift.md" ] || [ "${{ steps.verify.outputs.failed }}" = 1 ]; then
              printf '\n실패한 검증의 로그는 워크플로 실행에서 확인할 수 있습니다.\n'
            fi
            printf '\n'
            if grep -q '^## SDK drift$' "$RUNNER_TEMP/specs-drift.md"; then
              cat "$RUNNER_TEMP/specs-drift.md"
            fi
            printf '\n'
            cat "$RUNNER_TEMP/specs-diff.md"
            printf '\n'
            cat "$RUNNER_TEMP/specs-check.md"
          } > "$RUNNER_TEMP/specs-full-body.md"
          cat "$RUNNER_TEMP/specs-full-body.md" >> "$GITHUB_STEP_SUMMARY"
          # GitHub PR/이슈 본문 한도 안에서 줄 단위로 줄인다. 전체 보고서는 실행 요약에 남긴다.
          if [ "$(wc -c < "$RUNNER_TEMP/specs-full-body.md")" -gt 60000 ]; then
            head -c 59000 "$RUNNER_TEMP/specs-full-body.md" | sed '$d' > "$RUNNER_TEMP/specs-body.md"
            printf '\n전체 보고서는 위 워크플로 실행 요약을 확인하세요.\n' >> "$RUNNER_TEMP/specs-body.md"
          else
            cp "$RUNNER_TEMP/specs-full-body.md" "$RUNNER_TEMP/specs-body.md"
          fi

      - name: Publish or update the spec PR
        if: steps.check.outputs.update == 'true' && !inputs.dry_run
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FINGERPRINT: ${{ steps.check.outputs.fingerprint }}
          STRUCTURAL: ${{ steps.diff.outputs.major_count != '0' || steps.diff.outputs.deprecate_count != '0' || steps.diff.outputs.minor_count != '0' }}
        run: |
          body="$RUNNER_TEMP/specs-body.md"
          title='chore(specs): 넥슨 포털 스펙 갱신'
          marker="specs-auto-fingerprint:$FINGERPRINT"
          gh auth setup-git
          ref="refs/heads/$UPDATE_BRANCH"
          remote=$(git ls-remote --heads origin "$ref")
          remote_sha=${remote%%$'\t'*}
          same_snapshot=false
          if [ -n "$remote_sha" ]; then
            git fetch --no-tags --depth=1 origin "$ref"
            remote_sha=$(git rev-parse FETCH_HEAD)
            if git diff --quiet "$remote_sha" HEAD -- specs/openapi specs/notices.json; then
              same_snapshot=true
            fi
          fi
          pr=$(gh pr list --base main --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ "$same_snapshot" = true ] && [ -n "$pr" ]; then
            current=$(gh pr view "$pr" --json body --jq .body)
            if grep -qF "$marker" <<< "$current"; then
              echo "PR #$pr에 같은 변경이 보고되어 있습니다."
              exit 0
            fi
          fi
          if [ "$same_snapshot" = false ]; then
            git push --force-with-lease="$ref:$remote_sha" origin "HEAD:$ref"
            remote_sha=$(git rev-parse HEAD)
          fi
          if [ -z "$pr" ]; then
            if url=$(gh pr create --base main --head "$UPDATE_BRANCH" --title "$title" --body-file "$body"); then
              pr=${url##*/}
            fi
          elif ! gh pr edit "$pr" --title "$title" --body-file "$body"; then
            pr=
          fi
          if [[ "$pr" =~ ^[0-9]+$ ]]; then
            if [ "$STRUCTURAL" = true ]; then
              printf 'pr_number=%s\nbranch=%s\nsha=%s\n' "$pr" "$UPDATE_BRANCH" "$remote_sha" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo '::warning::PR을 게시하지 못했습니다. Settings → Actions → General의 PR 생성 권한을 확인하세요.'
          compare="${GITHUB_SERVER_URL}/${GH_REPO}/compare/main...${UPDATE_BRANCH}"
          printf '\n[브랜치 비교](%s)\n' "$compare" >> "$body"
          gh label create api-change --color D93F0B --description '넥슨 Open API 포털 스펙 변경 감지' --force
          issue=$(gh issue list --label api-change --state open --json number --jq '.[0].number // empty')
          if [ -z "$issue" ]; then
            gh issue create --title '넥슨 API 포털 변경 감지' --label api-change --body-file "$body"
          else
            previous=$(gh issue view "$issue" --json body,comments --jq '.body, .comments[].body')
            if ! grep -qF "$marker" <<< "$previous"; then
              gh issue comment "$issue" --body-file "$body"
            fi
          fi

      - name: Fail workflow if snapshot checks failed
        if: steps.verify.outputs.failed == '1'
        run: exit 1

      - name: Keep the schedule enabled
        if: always() && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        # 60일 규칙과 enable API는 문서화되어 있다. 이미 active일 때 비활성 타이머 갱신은
        # GitHub의 공식 보장이 없으며 아래 공개 구현과 같은 방식으로 미리 활성화한다.
        # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
        # https://docs.github.com/en/rest/actions/workflows#enable-a-workflow
        # https://github.com/liskin/gh-workflow-keepalive/blob/main/action.yml
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/api-monitor.yml/enable"

  implement:
    needs: monitor
    if: needs.monitor.outputs.pr_number != '' && vars.SDK_AUTO_IMPLEMENT != 'false'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/sdk-auto-update.yml
    with:
      branch: ${{ needs.monitor.outputs.branch }}
      pr_number: ${{ fromJSON(needs.monitor.outputs.pr_number) }}
      expected_sha: ${{ needs.monitor.outputs.sha }}
    secrets: inherit
