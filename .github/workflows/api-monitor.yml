name: API Monitor

# 넥슨 Open API 포털 변경 감지
#
# 커밋된 specs/openapi/index.json 과 현재 포털을 비교한다 (yarn specs:check).
# 감지: 게임 추가/삭제, 카테고리 추가/삭제, 스펙 YAML 수정, 오퍼레이션 추가/삭제
#
# - 변경이 있으면 `api-change` 라벨 이슈를 만들거나, 열린 이슈가 있으면 코멘트로 갱신한다.
# - 같은 변경 집합은 한 번만 보고한다 (보고서의 fingerprint로 중복 판별).
# - 수집 실패(네트워크·파싱)는 변경이 아니라 job 실패로 드러난다.
# - 차이를 없애려면: yarn specs:fetch 실행 후 specs/openapi/ 커밋.

on:
  schedule:
    # 매주 월요일 00:00 UTC (한국시간 09:00)
    - cron: '0 0 * * 1'
  workflow_dispatch: # 수동 실행 가능

permissions:
  issues: write
  contents: read

concurrency:
  group: api-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Check Nexon API Portal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # packageManager: "yarn@4.x" 를 인식하려면 setup-node 보다 먼저 필요
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies (lockfile)
        run: yarn install --immutable

      - name: Compare portal with committed specs
        id: check
        run: yarn specs:check

      - name: Report changes to issue
        if: steps.check.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPORT_PATH: ${{ steps.check.outputs.report_path }}
          CHANGES_COUNT: ${{ steps.check.outputs.changes_count }}
          FINGERPRINT: ${{ steps.check.outputs.fingerprint }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 라벨이 없으면 이슈 생성이 실패하므로 매번 보장한다 (--force: 있으면 갱신)
          gh label create api-change \
            --color D93F0B \
            --description "넥슨 Open API 포털 스펙 변경 감지" \
            --force

          BODY_FILE="${RUNNER_TEMP}/api-change-body.md"
          {
            cat "$REPORT_PATH"
            echo
            echo "[워크플로 실행 로그](${RUN_URL}) · 감지 시각 $(date -u +%Y-%m-%dT%H:%MZ)"
          } > "$BODY_FILE"

          ISSUE_NUMBER=$(gh issue list --label api-change --state open --json number --jq '.[0].number // empty')

          if [ -z "$ISSUE_NUMBER" ]; then
            gh issue create \
              --title "넥슨 API 포털 변경 감지 (${CHANGES_COUNT}건)" \
              --label api-change \
              --body-file "$BODY_FILE"
          elif gh issue view "$ISSUE_NUMBER" --json body,comments --jq '.body, .comments[].body' \
            | grep -qF "specs-check-fingerprint:${FINGERPRINT}"; then
            echo "이슈 #${ISSUE_NUMBER} 에 같은 변경 집합이 이미 보고되어 있어 코멘트를 생략합니다."
          else
            gh issue comment "$ISSUE_NUMBER" --body-file "$BODY_FILE"
          fi
