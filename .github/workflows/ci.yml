# CI/CD Pipeline — nexon-open-api SDK
# 품질 검사와 테스트가 통과하면 빌드와 패키지 검증을 실행한다.
# v* 태그에서는 검증한 빌드를 npm에 배포한다.
name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.check.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: Type Check, command: type-check } # SDK와 테스트 소스
          - { name: Lint, command: lint }
          - { name: Format, command: 'format:check' }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: ${{ matrix.check.name }}
        run: corepack yarn ${{ matrix.check.command }}

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 2026-11 현재 지원 중인 LTS 버전. 패키지의 engines.node 하한은 18이다.
        # https://github.com/nodejs/Release#release-schedule
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        if: matrix.node-version != 24
        run: corepack yarn test

      - name: Run tests with coverage
        if: matrix.node-version == 24
        run: corepack yarn test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == 24
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build
        run: corepack yarn build

      - name: Check package exports
        run: corepack yarn check:exports

      - name: Upload build artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # 최신 Node 24에 포함된 npm은 Trusted Publishing의 최소 버전(11.5.1)을 충족한다.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          registry-url: https://registry.npmjs.org

      - name: Verify tag and check npm version
        id: registry
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi

          STATUS=$(curl --silent --show-error --retry 3 --max-time 15 --output /dev/null \
            --write-out '%{http_code}' "https://registry.npmjs.org/$PKG_NAME/$PKG_VERSION")
          case "$STATUS" in
            200)
              echo "$PKG_NAME@$PKG_VERSION is already published. Skipping publish."
              echo 'should-publish=false' >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo 'should-publish=true' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::npm registry returned HTTP $STATUS when checking $PKG_NAME@$PKG_VERSION"
              exit 1
              ;;
          esac

      - name: Download build artifacts
        if: steps.registry.outputs.should-publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # 저장소에 NPM_TOKEN 시크릿이 없다. npm 패키지에 이 저장소의 ci.yml을
      # Trusted Publisher로 등록하면 OIDC 인증과 provenance를 사용할 수 있다.
      - name: Publish
        if: steps.registry.outputs.should-publish == 'true'
        run: npm publish --access public --provenance --ignore-scripts
